<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f1ea;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #6f4e37; /* رنگ قهوه‌ای کافه */
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #6f4e37;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            transition: background 0.3s;
        }

            .btn:hover {
                background-color: #553b2a;
            }
    </style>
</head>
<body>

    <div class="container">
        <h1>به سیستم مدیریت کافه خوش آمدید</h1>
        <p>این نسخه اولیه سیستم شماست که بر روی GitHub Pages قرار گرفته است.</p>
        <p>شما می‌توانید در آینده این صفحه را توسعه داده و بخش‌های مختلف سیستم مدیریت کافه را به آن اضافه کنید.</p>
        <a href="#" class="btn">ورود به پنل مدیریت</a>
    </div>

</body>
</html>
